backend:
  name: turbo-github
  turbo_site_id: 0df74ad3-8437-403c-849e-de9400125b83
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "pages"
    label: "Website Pages"
    folder: "content/pages"
    create: true
    extension: "yml"
    format: "yml"
    fields:
      - label: "Page Title"
        name: "title"
        widget: "string"
      - label: "Page Content"
        name: "body"
        widget: "text"
